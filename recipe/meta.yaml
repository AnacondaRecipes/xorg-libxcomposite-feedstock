{% set xorg_name = "libXcomposite" %}
{% set name = "xorg-" ~ xorg_name %}
{% set version = "0.4.7" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://www.x.org/releases/individual/lib/{{ xorg_name }}-{{ version }}.tar.xz
  sha256: 8bdf310967f484503fa51714cf97bff0723d9b673e0eecbf92b3f97c060c8ccb

build:
  number: 0
  # xorg-libxdmcp, libxcb, libx11, libice aren't available on Windows because their dependencies clash with m2/msys2 and mingw64/ucrt64 toolchains.
  skip: true  # [win]
  run_exports:
    - {{ pin_subpackage(name|lower) }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - pkg-config
    - gnuconfig
    - make
    - libtool
    - autoconf
    - automake
    - xorg-util-macros
  host:
    - xorg-xorgproto
    - xorg-libx11
    - xorg-libxfixes
    - xorg-util-macros

test:
  commands:
    - test -f $PREFIX/lib/libXcomposite.dylib  # [osx]
    - test -f $PREFIX/lib/libXcomposite.so     # [linux]

about:
  home: https://www.x.org/
  dev_url: https://gitlab.freedesktop.org/xorg/lib/libxcomposite
  doc_url: https://gitlab.freedesktop.org/xorg/lib/libxcomposite
  license: MIT
  license_family: MIT
  license_file: COPYING
  summary: X.org X11 Xlib-based client library for the Composite extension to the X11 protocol

extra:
  recipe-maintainers:
    - zklaus
